<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settlement Map Editor</title>
<style>
  :root { color-scheme: light; --ink:#2b2d42; --panel:#fffdf7; --line:#cbbfa6; --accent:#e63946; --gold:#c9a24a; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; font-family: Nunito, "Segoe UI", Arial, sans-serif; color: var(--ink); background:#efe8d8; }
  #app { display:grid; grid-template-columns: 1fr 340px; grid-template-rows: 48px 1fr; height:100%; }
  header { grid-column: 1 / -1; display:flex; align-items:center; gap:10px; padding:0 14px; background:#2b2d42; color:#f8f0dd; }
  header h1 { font-size:15px; margin:0 12px 0 0; letter-spacing:.06em; }
  header button, aside button, .btn { font: inherit; font-size:13px; padding:6px 10px; border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer; }
  header button { background:#3a3f5c; color:#f8f0dd; border-color:#555a7a; }
  header button:hover, aside button:hover { filter:brightness(1.07); }
  header .spacer { flex:1; }
  header label { font-size:12px; display:flex; align-items:center; gap:4px; }
  #map-wrap { position:relative; overflow:hidden; background:#a9c98a; touch-action:none; }
  svg { width:100%; height:100%; display:block; cursor:grab; }
  svg.panning { cursor:grabbing; }
  .obj { cursor:move; }
  .obj.selected .hit { stroke:var(--accent); stroke-width:3; }
  .obj.bad .hit { stroke:#ff0000; stroke-dasharray:4 3; stroke-width:3; }
  .obj.derived { cursor:not-allowed; opacity:.55; }
  .lbl { pointer-events:none; paint-order:stroke; stroke:#fff; stroke-width:3px; stroke-linejoin:round; font-weight:700; }
  aside { background:var(--panel); border-left:1px solid var(--line); padding:12px; overflow:auto; font-size:13px; }
  aside h2 { font-size:13px; letter-spacing:.1em; text-transform:uppercase; margin:14px 0 6px; color:#6b5a44; }
  aside .row { display:flex; gap:6px; align-items:center; margin:4px 0; }
  aside .row label { width:64px; color:#555; }
  aside input[type=number], aside input[type=text], aside select { font:inherit; padding:4px 6px; border:1px solid var(--line); border-radius:6px; width:100%; }
  aside .warn { background:#ffe8e8; border:1px solid #ff9a9a; color:#8a1a1a; padding:6px 8px; border-radius:6px; margin:6px 0; }
  aside .ok { color:#2f7a3a; }
  .add-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  textarea { width:100%; height:180px; font:12px/1.35 ui-monospace, Menlo, Consolas, monospace; border:1px solid var(--line); border-radius:6px; padding:6px; }
  .muted { color:#777; font-size:12px; }
  .changes { font-size:12px; max-height:140px; overflow:auto; border:1px solid var(--line); border-radius:6px; padding:6px; background:#fff; }
  .changes div { padding:1px 0; border-bottom:1px dashed #eee; }
  kbd { background:#eee; border:1px solid #ccc; border-radius:4px; padding:0 5px; font-size:11px; }
  @media (max-width: 860px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 48px 1fr 300px; }
    aside { border-left:0; border-top:1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🏘️ SETTLEMENT MAP EDITOR</h1>
    <button id="btn-undo" title="Ctrl+Z">↶ Undo</button>
    <button id="btn-redo" title="Ctrl+Y">↷ Redo</button>
    <label><input type="checkbox" id="snap" checked> snap 0.5</label>
    <label><input type="checkbox" id="show-derived"> show generated items</label>
    <span class="spacer"></span>
    <button id="btn-zoom-out">−</button>
    <button id="btn-zoom-in">+</button>
    <button id="btn-fit">Fit</button>
    <button id="btn-reset" title="Discard all edits">Reset</button>
  </header>

  <div id="map-wrap"><svg id="map" xmlns="http://www.w3.org/2000/svg"></svg></div>

  <aside>
    <div class="muted">Drag anything. Arrow keys nudge the selection (<kbd>Shift</kbd> = 2 units). <kbd>Del</kbd> removes. Drag empty ground to pan, wheel to zoom. Edits auto-save in this browser.</div>

    <h2>Selection</h2>
    <div id="sel-none" class="muted">Nothing selected.</div>
    <div id="sel"></div>

    <h2>Add</h2>
    <div class="add-grid">
      <button data-add="trees">🌳 Tree</button>
      <button data-add="bushes">🌿 Bush</button>
      <button data-add="lamps">💡 Lamp</button>
      <button data-add="npcs">🧍 NPC</button>
      <button data-add="flowers">✿ Flowers</button>
      <button data-add="rocks">🪨 Rock</button>
      <button data-add="tables">🪑 Table</button>
      <button data-add="barrels">🛢 Barrel</button>
    </div>
    <div class="muted" style="margin-top:4px">New items appear at the centre of the view.</div>

    <h2>Changes <span id="change-count" class="muted"></span></h2>
    <div class="changes" id="changes"><div class="muted">No changes yet.</div></div>

    <h2>Export</h2>
    <div class="row">
      <button id="btn-export">Generate town-world.js snippets</button>
      <button id="btn-copy">Copy</button>
      <button id="btn-json">Download JSON</button>
    </div>
    <textarea id="out" readonly placeholder="Snippets appear here — paste each block over the matching array in town-world.js."></textarea>
  </aside>
</div>

// ── Validation ───────────────────────────────────────────────────
function onRoad(x, z, pad = 0) {

  if (Math.abs(x) < ROAD_HALF + pad && z > -52 - pad && z < 61 + pad) return 'north/south road';
  if (Math.abs(z) < ROAD_HALF + pad && Math.abs(x) < 61 + pad) return 'east/west road';

}

}

}

}
function footprintRadius(type, it, i) {

    case 'bushes': return (it.scale ?? 0.7) * 0.9;
    case 'stalls': return 1.9;
    case 'tables': return 1.0;
    case 'campfire': return 1.1;
    case 'beds': return 1.5;
    case 'lamps': return 0.35;
    case 'signs': return 0.4;
    case 'npcs': return 0.5;

let dyn;

    (data[type] || []).forEach((it, i) => {
      if (it.removed) return;
      if (it.derived && !showDerived) return;

// ── Interaction: drag / pan / zoom ───────────────────────────────
function svgPoint(evt) {

    svg.setPointerCapture(e.pointerId);
  } else {
    drag = { pan: true, sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y };

svg.addEventListener('pointermove', e => {

    view.y = drag.vy - (e.clientY - drag.sy) * k;

  const p = svgPoint(e);

svg.addEventListener('wheel', e => {

document.getElementById('btn-zoom-out').onclick = () => zoomAt(1.3);
document.getElementById('btn-fit').onclick = () => { view = { x: -EXT * S - 20, y: -EXT * S - 20, w: EXT * 2 * S + 40, h: EXT * 2 * S + 40 }; applyView(); };
function zoomAt(f) { const cx = view.x + view.w / 2, cy = view.y + view.h / 2; view.w *= f; view.h *= f; view.x = cx - view.w / 2; view.y = cy - view.h / 2; applyView(); }

// ── Selection panel ──────────────────────────────────────────────
function select(type, index) {

  if (prev) { const e = dyn.querySelector(`.obj[data-type="${prev.type}"][data-index="${prev.index}"]`); if (e) e.classList.remove('selected'); }

}

  }

  if (type === 'stalls') box.appendChild(field('red awning', 'red', it, type, index, { options: ['true', 'false'] }));
  if (type === 'npcs') box.appendChild(field('variant', 'variant', it, type, index, { options: ['0', '1', '2'] }));
  if (type === 'signs') box.appendChild(field('text', 'text', it, type, index, { type: 'text' }));

function labelOf(type, it, i) {

// ── Keyboard ─────────────────────────────────────────────────────
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
  if (!selected) return;
  const it = data[selected.type][selected.index];
  const step = e.shiftKey ? 2 : 0.5;
  const moves = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
  if (moves[e.key]) { e.preventDefault(); pushHistory(); it.x = +(it.x + moves[e.key][0]).toFixed(2); it.z = +(it.z + moves[e.key][1]).toFixed(2); renderAll(); }
  if ((e.key === 'Delete' || e.key === 'Backspace') && !['buildings', 'spawns', 'campfire', 'beds', 'stalls', 'signs'].includes(selected.type)) { pushHistory(); it.removed = true; select(null); renderAll(); }
});
function undo() { if (!history.length) return; future.push(deepClone(data)); data = history.pop(); select(null); renderAll(); }
function redo() { if (!future.length) return; history.push(deepClone(data)); data = future.pop(); select(null); renderAll(); }
document.getElementById('btn-undo').onclick = undo;
document.getElementById('btn-redo').onclick = redo;
document.getElementById('btn-reset').onclick = () => { if (confirm('Discard every edit and reload the map from town-world.js data?')) { pushHistory(); data = deepClone(BASE); select(null); renderAll(); } };
document.getElementById('show-derived').onchange = renderAll;

// ── Add ──────────────────────────────────────────────────────────
document.querySelectorAll('[data-add]').forEach(btn => btn.onclick = () => {
  const type = btn.dataset.add;
  const cx = snapV((view.x + view.w / 2) / S), cz = snapV((view.y + view.h / 2) / S);
  const base = { x: cx, z: cz, added: true };
  const extra = { trees: { species: 'green' }, bushes: { species: 'green', scale: 0.7 }, npcs: { variant: 0 } }[type] || {};
  pushHistory();
  data[type] = data[type] || [];
  data[type].push(Object.assign(base, extra));
  renderAll();
  select(type, data[type].length - 1);
});

// ── Changes list ─────────────────────────────────────────────────
function changes() {
  const out = [];
  for (const type of ORDER) {
    (data[type] || []).forEach((it, i) => {
      const b = (BASE[type] || [])[i];
      if (it.added && !it.removed) { out.push(`+ ${labelOf(type, it, i)} at (${it.x}, ${it.z})`); return; }
      if (!b) return;
      if (it.removed && !b.removed) { out.push(`− ${labelOf(type, b, i)} (${b.x}, ${b.z})`); return; }
      const diffs = [];
      for (const k of Object.keys(it)) if (k !== 'removed' && k !== 'added' && JSON.stringify(it[k]) !== JSON.stringify(b[k])) diffs.push(`${k}: ${b[k]} → ${it[k]}`);
      if (diffs.length) out.push(`~ ${labelOf(type, it, i)}: ${diffs.join(', ')}`);
    });
  }
  return out;
}
function renderChanges() {
  const c = changes(); const box = document.getElementById('changes');
  document.getElementById('change-count').textContent = c.length ? `(${c.length})` : '';
  box.innerHTML = c.length ? c.map(s => `<div>${s}</div>`).join('') : '<div class="muted">No changes yet.</div>';
}

// ── Export ───────────────────────────────────────────────────────
const num = v => (Math.round(v * 100) / 100).toString();
function exportSnippets() {
  const L = [];
  const live = type => (data[type] || []).filter(it => !it.removed && !it.derived);
  L.push('// ═══ Paste each block over the matching array in town-world.js ═══\n');

  L.push('// BUILDINGS — only the x/z/w/h/d numbers change; colours, roofs, labels are kept from the original line');
  L.push('const BUILDINGS = [');
  for (const b of live('buildings')) {
    const src = b.src.replace(/x: -?[\d.]+, z: -?[\d.]+, w: [\d.]+, h: [\d.]+, d: [\d.]+/, `x: ${num(b.x)}, z: ${num(b.z)}, w: ${num(b.w)}, h: ${num(b.h)}, d: ${num(b.d)}`)
      .replace(/label: (['"]).*?\1/, `label: ${JSON.stringify(b.label)}`).replace(/zone: '\w+'/, `zone: '${b.zone}'`);
    L.push('  ' + src.replace(/\n\s*/g, '\n    '));
  }
  L.push('];\n');

  L.push('// TREES (inside the .map(...) in town-world.js) — [x, z, species]; scale comes from the index');
  L.push('  const TREES = [');
  for (const t of live('trees')) L.push(`    [${num(t.x)}, ${num(t.z)}, '${t.species}'],`);
  L.push('  ].map(([x, z, sp], i) => [x, z, treeScale(i), sp]);\n');

  L.push('// BUSHES.push( ... ) — hand-placed bushes only (bed and wall bushes are generated in code)');
  L.push('  BUSHES.push(');
  for (const b of live('bushes')) L.push(`    [${num(b.x)}, ${num(b.z)}, ${num(b.scale ?? 0.7)}, '${b.species}'],`);
  L.push('  );\n');

  L.push('// LAMPS — hand-placed (the 6 ring-road lamps are generated in code)');
  L.push('  const LAMPS = [');
  for (const l of live('lamps')) L.push(`    [${num(l.x)}, ${num(l.z)}],`);
  L.push('  ];\n');

  L.push('// NPC placements — buildNpcs(scene, [ ... ])');
  L.push('    buildNpcs(scene, [');
  for (const n of live('npcs')) L.push(`      [${num(n.x)}, ${num(n.z)}, ${n.variant ?? 0}],`);
  L.push('    ]);\n');

  L.push('// Wild flower clusters — buildWildFlowers(scene, [ ... ])');
  L.push('    buildWildFlowers(scene, [');
  L.push('      ' + live('flowers').map(f => `[${num(f.x)}, ${num(f.z)}]`).join(', ') + ',');
  L.push('    ]);\n');

  L.push('// Market stalls — [x, z, rotation, redAwning]');
  L.push('  [' + live('stalls').map(s => `[${num(s.x)}, ${num(s.z)}, ${rotExpr(s.rot)}, ${!!s.red}]`).join(', ') + ']');
  L.push('    .forEach(([x, z, r, red]) => colliders.push(buildStall(scene, x, z, r, { red }).collider));\n');

  L.push('// Tavern terrace');
  L.push('  const TABLES = [' + live('tables').map(t => `[${num(t.x)}, ${num(t.z)}]`).join(', ') + '];');
  const cf = live('campfire')[0]; if (cf) L.push(`  const CAMPFIRE = { x: ${num(cf.x)}, z: ${num(cf.z)} };`);
  L.push('  // barrels');
  L.push('  [' + live('barrels').map(b => `[${num(b.x)}, ${num(b.z)}]`).join(', ') + '].forEach(([x,z]) => {\n');

  L.push('// Flower beds');
  L.push('  const BED_SLOTS = [' + live('beds').map(b => `[${num(b.x)}, ${num(b.z)}]`).join(', ') + '];\n');

  L.push('// Rocks');
  L.push('  [' + live('rocks').map(r => `[${num(r.x)}, ${num(r.z)}]`).join(', ') + '].forEach(([x, z]) => scene.add(createRock(x, z, 0.6 + Math.random() * 0.8)));\n');

  L.push('// Signboards — addSignboard(x, z, text, rotY)');
  for (const s of live('signs')) L.push(`  addSignboard(${num(s.x)}, ${num(s.z)}, ${JSON.stringify(s.text || '')}, ${rotExpr(s.rot)});`);
  L.push('');

  L.push('// ZONES spawn points (fast-travel) — rot in radians');
  L.push('export const ZONES = {');
  for (const sp of live('spawns')) L.push(`  ${sp.key.padEnd(8)}: { name: ${JSON.stringify(sp.name)}, spawn: { x: ${num(sp.x)}, z: ${num(sp.z)}, rot: ${rotExpr(sp.rotDeg)} } },`);
  L.push('};');
  return L.join('\n');
}
function rotExpr(deg) {
  const d = ((deg % 360) + 360) % 360;
  const map = { 0: '0', 90: 'Math.PI / 2', 180: 'Math.PI', 270: '-Math.PI / 2' };
  return map[d] ?? `${(d * Math.PI / 180).toFixed(4)}`;
}
document.getElementById('btn-export').onclick = () => { document.getElementById('out').value = exportSnippets(); };
document.getElementById('btn-copy').onclick = async () => {
  const ta = document.getElementById('out'); if (!ta.value) ta.value = exportSnippets();
  try { await navigator.clipboard.writeText(ta.value); document.getElementById('btn-copy').textContent = 'Copied ✓'; setTimeout(() => document.getElementById('btn-copy').textContent = 'Copy', 1500); }
  catch (_) { ta.select(); }
};
document.getElementById('btn-json').onclick = () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'town-placements.json'; a.click();
};

renderAll();
</script>
